<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report damp, mould or cold</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="banner" data-text="prototypeBanner"></div>
  <header class="site has-logo">
    <img class="logo" src="logo.svg" alt="Healthier homes">
    <p><a href="index.html" style="color:#fff">Back to staff view</a></p>
  </header>

  <main class="narrow">
    <form id="report-form" novalidate>
      <h1 data-text="reportTitle"></h1>
      <p data-text="reportIntro"></p>
      <p><a href="track.html" data-text="reportTrackLink"></a></p>

      <fieldset class="checks" aria-describedby="problem-hint">
        <legend data-text="qProblem"></legend>
        <p class="hint" id="problem-hint" data-text="qProblemHint"></p>
        <label><input type="checkbox" name="problem" value="Damp"> Damp</label>
        <label><input type="checkbox" name="problem" value="Mould"> Mould</label>
        <label><input type="checkbox" name="problem" value="Condensation"> Wet windows or walls</label>
        <label><input type="checkbox" name="problem" value="Cold"> Can't keep warm</label>
        <label><input type="checkbox" name="problem" value="Something else"> Something else</label>
      </fieldset>

      <fieldset class="checks" aria-describedby="rooms-hint">
        <legend data-text="qRooms"></legend>
        <p class="hint" id="rooms-hint" data-text="qRoomsHint"></p>
        <label><input type="checkbox" name="room" value="Kitchen"> Kitchen</label>
        <label><input type="checkbox" name="room" value="Bedroom"> Bedroom</label>
        <label><input type="checkbox" name="room" value="Bathroom or toilet"> Bathroom or toilet</label>
        <label><input type="checkbox" name="room" value="Living room"> Living room</label>
        <label><input type="checkbox" name="room" value="Hall or stairs"> Hall or stairs</label>
        <label><input type="checkbox" name="room" value="Somewhere else"> Somewhere else</label>
      </fieldset>

      <div class="form-row">
        <label for="description" data-text="qDescription"></label>
        <span class="hint" id="description-hint" data-text="qDescriptionHint"></span>
        <textarea id="description" name="description" rows="4" aria-describedby="description-hint"></textarea>
      </div>

      <div class="form-row">
        <label for="photos" data-text="qPhotos"></label>
        <span class="hint" id="photos-hint" data-text="qPhotosHint"></span>
        <input type="file" id="photos" name="photos" accept="image/*" multiple aria-describedby="photos-hint">
      </div>

      <fieldset class="checks" aria-describedby="health-hint">
        <legend data-text="qHealth"></legend>
        <p class="hint" id="health-hint" data-text="qHealthHint"></p>
        <label><input type="radio" name="health" value="Yes"> Yes</label>
        <label><input type="radio" name="health" value="No"> No</label>
        <label><input type="radio" name="health" value="Rather not say" checked> I'd rather not say</label>
      </fieldset>

      <div class="form-row"><label for="name" data-text="qName"></label><input id="name" name="name" autocomplete="name"></div>
      <div class="form-row"><label for="address" data-text="qAddress"></label><input id="address" name="address" autocomplete="street-address"></div>
      <div class="form-row"><label for="contact" data-text="qContact"></label><input id="contact" name="contact"></div>
      <fieldset class="checks" aria-describedby="contact-way-hint">
        <legend data-text="qContactWay"></legend>
        <p class="hint" id="contact-way-hint" data-text="qContactWayHint"></p>
        <label><input type="checkbox" name="contactWay" value="Phone call"> Phone call</label>
        <label><input type="checkbox" name="contactWay" value="Text message"> Text message</label>
        <label><input type="checkbox" name="contactWay" value="Email"> Email</label>
        <label><input type="checkbox" name="contactWay" value="Letter"> Letter</label>
      </fieldset>

      <fieldset class="checks" aria-describedby="contact-time-hint">
        <legend data-text="qContactTime"></legend>
        <p class="hint" id="contact-time-hint" data-text="qContactTimeHint"></p>
        <label><input type="checkbox" name="contactTime" value="Morning"> Morning</label>
        <label><input type="checkbox" name="contactTime" value="Afternoon"> Afternoon</label>
        <label><input type="checkbox" name="contactTime" value="Evening"> Evening</label>
        <label><input type="checkbox" name="contactTime" value="Any time"> Any time</label>
      </fieldset>

      <button type="submit" class="primary" data-text="submitButton"></button>
    </form>

    <section id="thanks" hidden tabindex="-1">
      <h1 data-text="thanksTitle"></h1>
      <p id="thanks-body"></p>
      <p><a id="thanks-track" href="track.html" data-text="thanksTrack"></a></p>
      <button type="button" class="primary" id="again" data-text="thanksAgain"></button>
    </section>
  </main>

  <script src="content.js"></script>
  <script src="shared.js"></script>
  <script src="data/homes.js"></script>
  <script src="report.js"></script>
</body>
</html>
