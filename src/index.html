<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healthier homes: staff view</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="glance.css">
</head>
<body>
  <div class="banner" data-text="prototypeBanner"></div>
  <header class="site has-logo">
    <img class="logo" src="logo.svg" alt="">
    <div>
      <h1 data-text="dashTitle"></h1>
      <p data-text="dashIntro"></p>
    </div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#overview" data-tab="overview" aria-current="page" data-text="navDashboard"></a>
    <a href="#reports" data-tab="reports" data-text="navReports"></a>
    <a href="#visits" data-tab="visits" data-text="navVisits"></a>
    <a href="#cases" data-tab="cases" data-text="navCases"></a>
    <a href="report.html" data-text="navTenant"></a>
    <a href="visit.html">Visit app</a>
  </nav>

  <main>
    <div id="tab-overview">
      <section class="panel glance" id="sec-glance" aria-labelledby="glance-title">
        <h2 id="glance-title" data-text="glanceTitle"></h2>
        <p class="hint" data-text="glanceHelp"></p>
        <div class="glance-cards" id="glance-cards"></div>

        <h3 id="trend-title" data-text="trendTitle"></h3>
        <div class="trend-key" aria-hidden="true">
          <span class="key-high" data-text="seriesHighKey"></span>
          <span class="key-medium" data-text="seriesMediumKey"></span>
        </div>
        <div class="trend-chart" id="trend-chart"></div>
        <p class="trend-summary" id="trend-summary"></p>
      </section>

      <section class="panel" id="sec-areas" aria-labelledby="heat-title">
        <div class="area-head">
          <div>
            <h2 id="heat-title" data-text="heatTitle"></h2>
            <p class="hint" data-text="heatHelp"></p>
          </div>
        </div>
        <div class="area-split" id="heatmap"></div>
      </section>

      <section class="panel" id="sec-homes" aria-labelledby="list-title">
        <h2 id="list-title" tabindex="-1" data-text="listTitle"></h2>
        <p class="active-filter" id="active-filter" hidden><span></span> <button type="button" class="link" id="clear-filter" data-text="clearFilter"></button></p>
        <div class="filters">
          <label><span data-text="filterSearch"></span><input type="search" id="search" class="with-hint"></label>
          <label><span data-text="filterArea"></span><select id="filter-area"></select></label>
          <label><span data-text="filterBand"></span><select id="filter-band"></select></label>
          <label><span data-text="filterReason"></span><select id="filter-reason"></select></label>
          <label><span data-text="filterStatus"></span><select id="filter-status"></select></label>
        </div>
        <div class="list-meta">
          <p id="homes-count" aria-live="polite"></p>
          <button type="button" class="link" id="clear-all" data-text="clearAllFilters" hidden></button>
        </div>
        <p class="print-only" id="homes-print-note"></p>
        <div class="table-wrap">
          <table>
            <caption class="visually-hidden" id="homes-caption"></caption>
            <thead><tr>
              <th data-col="risk"><button type="button" class="sort" data-sort="risk"><span data-text="colRisk"></span><span class="sort-icon" aria-hidden="true"></span></button></th>
              <th data-col="home"><button type="button" class="sort" data-sort="home"><span data-text="colHome"></span><span class="sort-icon" aria-hidden="true"></span></button></th>
              <th data-col="area"><button type="button" class="sort" data-sort="area"><span data-text="colArea"></span><span class="sort-icon" aria-hidden="true"></span></button></th>
              <th data-col="reasons"><button type="button" class="sort" data-sort="reasons"><span data-text="colReasons"></span><span class="sort-icon" aria-hidden="true"></span></button></th>
              <th data-col="status"><button type="button" class="sort" data-sort="status"><span data-text="colStatus"></span><span class="sort-icon" aria-hidden="true"></span></button></th>
            </tr></thead>
            <tbody id="homes"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="panel" id="tab-reports" hidden aria-labelledby="reports-title">
      <h2 id="reports-title" tabindex="-1" data-text="reportsTitle"></h2>
      <p class="active-filter" id="report-home-filter" hidden><span></span> <button type="button" class="link" id="clear-report-home" data-text="showAllReports"></button></p>
      <div class="filters">
        <label><span data-text="filterReportBand"></span><select id="report-filter-band"></select></label>
        <label><span data-text="filterReportStatus"></span><select id="report-filter-status"></select></label>
        <label><span data-text="filterReportType"></span><select id="report-filter-type"></select></label>
      </div>
      <div id="reports-list"></div>
    </section>

    <div id="tab-visits" hidden>
      <div class="summary compact" id="plan-summary"></div>

      <section class="panel" aria-labelledby="visits-title">
        <h2 id="visits-title" data-text="visitsTitle"></h2>
        <p class="hint" data-text="planIntro"></p>
        <div class="cal-tools">
          <button type="button" class="small" id="week-prev" data-text="weekPrev"></button>
          <strong id="week-label" aria-live="polite"></strong>
          <button type="button" class="small" id="week-next" data-text="weekNext"></button>
          <label class="cal-who"><span data-text="planWho"></span> <select id="plan-who"></select></label>
        </div>
        <div class="cal-wrap"><div id="calendar" class="calendar"></div></div>
        <p id="cal-empty" class="hint"></p>
        <div id="cal-legend" class="cal-legend"></div>
        <div id="plan-unplanned"></div>
        <div id="plan-recorded"></div>
      </section>

      <section class="panel" aria-labelledby="where-title">
        <h2 id="where-title" data-text="whereTitle"></h2>
        <p class="hint" data-text="whereHelp"></p>
        <div class="table-wrap"><table class="where" id="where-grid"></table></div>
        <div id="where-map" class="where-map"></div>
      </section>

      <details class="panel">
        <summary><h2 id="team-title" data-text="teamTitle"></h2></summary>
        <p class="hint" data-text="teamHelp"></p>
        <div id="plan-team" class="team"></div>
        <form id="plan-add" class="add-person">
          <h3 data-text="addPersonTitle"></h3>
          <div class="times">
            <label for="add-name">Name <input id="add-name" autocomplete="off" required></label>
            <label for="add-role">Role <input id="add-role" autocomplete="off"></label>
          </div>
          <button type="submit" class="primary" data-text="addPersonButton"></button>
        </form>
      </details>

      <details class="panel">
        <summary><h2 id="rules-title" data-text="rulesTitle"></h2></summary>
        <p class="hint" data-text="rulesHelp"></p>
        <div id="plan-rules"></div>
        <button type="button" class="link" id="plan-reset" data-text="resetPlanner"></button>
      </details>
    </div>

    <div id="tab-cases" hidden>
      <section class="panel" id="cases-list" aria-labelledby="cases-title">
        <h2 id="cases-title" data-text="casesTitle"></h2>
        <p class="hint" data-text="casesHelp"></p>
        <div class="case-chips" id="case-chips"></div>

        <form class="case-filters" id="case-filters" role="search" aria-labelledby="filters-title">
          <h3 id="filters-title" class="visually-hidden" data-text="casesFilterTitle"></h3>
          <div class="cf-search">
            <label for="case-search" data-text="casesSearch"></label>
            <span class="hint" id="case-search-hint" data-text="casesSearchHint"></span>
            <input type="search" id="case-search" autocomplete="off" aria-describedby="case-search-hint">
          </div>
          <label class="cf-field"><span data-text="casesSort"></span>
            <select id="case-sort">
              <option value="updated" data-text="sortUpdated"></option>
              <option value="risk" data-text="sortRisk"></option>
              <option value="next" data-text="sortNext"></option>
              <option value="address" data-text="sortAddress"></option>
            </select></label>
          <fieldset class="cf-risk">
            <legend data-text="casesRisk"></legend>
            <div class="checks inline">
              <label><input type="checkbox" name="risk" value="High" checked> High</label>
              <label><input type="checkbox" name="risk" value="Medium" checked> Medium</label>
              <label><input type="checkbox" name="risk" value="Low" checked> Low</label>
            </div>
          </fieldset>
          <label class="cf-field"><span data-text="casesUpdated"></span>
            <select id="case-updated">
              <option value="" data-text="optAnyTime"></option>
              <option value="1" data-text="optToday"></option>
              <option value="7" data-text="optWeek"></option>
              <option value="30" data-text="optMonth"></option>
              <option value="stale" data-text="optStale"></option>
            </select></label>
          <label class="cf-field"><span data-text="casesStage"></span><select id="case-stage"></select></label>
          <label class="cf-field"><span data-text="casesArea"></span><select id="case-area"></select></label>
          <label class="cf-field"><span data-text="casesShow"></span>
            <select id="case-show"><option value="open" data-text="optOpen"></option><option value="all" data-text="optAll"></option></select></label>
        </form>

        <div class="cf-results">
          <p id="case-count" role="status"></p>
          <button type="button" class="link" id="case-clear" data-text="casesClear"></button>
        </div>
        <ul class="case-list" id="cases-rows"></ul>
        <p class="case-more"><button type="button" class="small" id="case-more" hidden></button></p>
      </section>
      <div id="case-view"></div>
      <p id="case-live" class="visually-hidden" role="status" aria-live="polite"></p>
    </div>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-body" id="detail-body"></div>
  </dialog>

  <dialog id="visit-dialog" aria-labelledby="visit-title">
    <div class="dialog-body" id="visit-body"></div>
  </dialog>

  <script src="content.js"></script>
  <script src="shared.js"></script>
  <script src="data/homes.js"></script>
  <script src="data/trend.js"></script>
  <script src="risk.js"></script>
  <script src="glance.js"></script>
  <script src="app.js"></script>
  <script src="export.js"></script>
  <script src="data/locations.js"></script>
  <script src="data/rota.js"></script>
  <script src="data/cases.js"></script>
  <script src="planner.js"></script>
  <script src="case.js"></script>
</body>
</html>
